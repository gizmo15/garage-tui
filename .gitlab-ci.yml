# .gitlab-ci.yml
default:
  tags:
    - gizmo
  interruptible: true
  timeout: 10m

image: "harbor.securmail.fr/rust/rust-ci:1.99.0-trixie"

stages:
  - lint
  - audit
  - build
  - test

variables:
  # move cargo data into the project directory so it can be cached
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # treat compiler warnings as errors (in clippy, when running tests, etc.)
  RUSTFLAGS: -Dwarnings

default:
  # cancel the job if a newer pipeline starts for the same MR or branch
  interruptible: true
  tags:
    - gizmo
  cache:
    # use the git branch or tag as cache key, so the cache will be
    # shared among CI runs for the same branch or tag
    key: ${CI_COMMIT_REF_SLUG}
    # we cache .cargo/ and target/, which effectively enables
    # incremental builds across different executions of the CI
    # for the same branch or the same merge request
    paths:
      - .cargo
      - target

# a format check is run in parallel with the rest
cargo:fmt:
  stage: lint
  script:
    - cargo fmt --check
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

# the clippy linter runs before tests are executed
cargo:clippy:
  stage: lint
  # this job is only run if fmt passes
  needs: ["cargo:fmt"]
  script:
    - cargo clippy --all-targets
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

cargo:audit:
  stage: audit
  needs: ["cargo:clippy"]
  script:
    - cargo audit
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

cargo:coverage:
  stage: audit
  needs: ["cargo:audit"]
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)/'
  script:
    - cargo llvm-cov --ignore-filename-regex 'main\.rs'
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

cargo:test:
  stage: test
  # this job is only run if audit passes
  needs: ["cargo:audit"]
  script:
    # unit tests only: no external service needed (JSON fixtures in tests/fixtures/)
    # run nextest with the "ci" profile, which produces a junit XML test report
    - cargo nextest run --profile ci
  artifacts:
    when: always
    reports:
      # point GitLab to the junit test report: it will automatically display it in a dashboard
      junit: $CI_PROJECT_DIR/target/nextest/ci/junit.xml
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
