[package]
name = "garage-ci"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures = "0.3.34"
humansize = "2.1.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }

[profile.release]
lto = true           # link-time optimization
codegen-units = 1    # better optimization, slower compile
panic = "abort"      # removes unwinding machinery
strip = true         # removes symbols automatically (Rust 1.70+)

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
